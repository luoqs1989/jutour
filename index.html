<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JUTour · 韩国医美旅游定制</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Display serif used only for headings/accents across zh/en/ko: the browser
      picks whichever family covers a given character, so Chinese headings render
      in Noto Serif SC, Korean in Noto Serif KR, and Latin in Noto Serif — see the
      --font-display fallback chain in src/index.css. Body copy stays on system
      fonts (no webfont) for performance; only heading-weight glyphs are fetched.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Noto+Serif+KR:wght@600;700&family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // GitHub Pages SPA fallback: decode the redirected path (see public/404.html)
      // before the router mounts, so deep links survive a hard refresh.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
