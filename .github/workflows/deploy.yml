name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Repo-name subpath so asset URLs and client-side routes resolve
          # correctly at https://<user>.github.io/jutour/.
          VITE_BASE_PATH: /jutour/
          # Injected from a repository secret so the key never lives in the
          # committed source. See README for why this is still not fully
          # confidential once bundled into a public static site.
          VITE_VISITSEOUL_API_KEY: ${{ secrets.VITE_VISITSEOUL_API_KEY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
